[workspace]
resolver = "2"
members = [
    "crates/quant_core",
    "crates/quant_exec",
    "crates/quant_lib",
]

[workspace.dependencies]
rand = "0.10.3"
rstest = "0.27.0"
proptest = "1.11.0"
clap = {version = "4.6.6", features = ["derive"]}
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
tracing-appender = "0.2.5"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
ndarray = { version = "*", features = ["blas", "lapack"] }
blas-src = { version = "*", features = ["openblas"] }
lapack-src = { version = "*", features = ["openblas"] }

[profile.release]
debug = true

[workspace]
resolver = "2"
members = [
    "crates",
    "crates/quant_lib",
    "crates/quant_book",
    "crates/quant_core",
    "crates/quant_exec",
    "crates/quant_math",
]

[workspace.dependencies]
rand = "0.10.3"
rstest = "0.28.0"
proptest = "1.11.0"
clap = {version = "4.6.6", features = ["derive"]}
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
ndarray = { version = "0.17.2", features = ["blas"] }
ndarray-linalg = { version = "0.18.1", features = ["openblas"] }
blas-src = { version = "0.14.0", features = ["openblas"] }
lapack-src = { version = "0.13.0", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["cblas"] }

[profile.release]
debug = true
